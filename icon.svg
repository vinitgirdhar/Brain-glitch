<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5cf5"/>
      <stop offset="0.55" stop-color="#a24bf0"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <rect y="262" width="512" height="30" fill="#000"/>
    </mask>
    <clipPath id="slice-a"><rect y="262" width="512" height="30"/></clipPath>
    <g id="orb">
      <circle cx="304" cy="296" r="122" fill="#1e7bff"/>
      <circle cx="304" cy="296" r="122" fill="none" stroke="#ffffff" stroke-width="16"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#hl)"/>
  <!-- A square that wants to be a circle: the game in one picture. -->
  <rect x="92" y="98" width="206" height="206" rx="48" fill="#ff3b30" transform="rotate(-10 195 201)"/>
  <use href="#orb" mask="url(#cut)"/>
  <!-- Glitch: one slice of the circle knocked sideways. -->
  <g clip-path="url(#slice-a)"><use href="#orb" x="34"/></g>
</svg>
