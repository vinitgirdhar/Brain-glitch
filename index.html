<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Brain Glitch</title>
  <meta name="description" content="Your brain knows the answer. Your fingers disagree. A free brain-training and reflex game.">
  <meta name="theme-color" id="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brain Glitch">
  <meta name="application-name" content="Brain Glitch">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-180.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking font: system fonts render first, and offline play never waits on it. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash; match the browser chrome colour.
    try {
      var t = (JSON.parse(localStorage.getItem('brainglitch.v1') || '{}').settings || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var dark = t === 'light' || t === 'dark' ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-dark', dark ? '1' : '0');
      document.getElementById('theme-color').setAttribute('content', dark ? '#000000' : '#f5f5f7');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="app">
    <header class="topbar" hidden>
      <button class="icon-btn" id="btn-back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title"></div>
      <span class="topbar-spacer"></span>
    </header>
    <main id="stage" class="stage"></main>
  </div>

  <div id="sheet-root"></div>
  <div id="ach-root" class="ach-root" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/play.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Last-resort fallback (plain ES5): if the game never drew a screen, offer a reload.
    setTimeout(function () {
      var stage = document.getElementById('stage');
      if (stage && !stage.firstElementChild) {
        stage.innerHTML = '<div style="padding:40px 8px;text-align:center"><h1 class="title">Could not start the game</h1>' +
          '<p class="lead" style="margin:16px 0 24px">Please reload, or open this link in Chrome or Safari.</p>' +
          '<button class="btn btn-primary" onclick="location.reload()">Reload</button></div>';
      }
    }, 4000);
  </script>
</body>
</html>
